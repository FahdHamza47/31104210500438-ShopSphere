name: CI/CD Pipeline

# Task 4.1: install -> build -> deploy-to-production-on-main, with three
# separate environments (development is local/unstaged, staging is Vercel's
# automatic Preview deployment on every PR using Preview-scoped env vars set
# in the Vercel dashboard, production is this workflow's `deploy` job using
# the `production` GitHub Environment below). No credential ever appears in
# this file or in a log line — every secret is referenced as
# ${{ secrets.X }} and passed straight into an env var that tools read
# silently; nothing is echoed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # 1. Install + test the backend against a real (throwaway) Postgres —
  #    Prisma has no in-memory substitute, so CI spins one up as a service
  #    container, runs migrations into it, then runs the suite.
  # ---------------------------------------------------------------------
  backend-tests:
    name: Backend — install, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopsphere_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopsphere_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shopsphere_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopsphere_ci
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shopsphere_ci
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations to the CI database
        run: npx prisma migrate deploy

      - name: Build (type-check + compile)
        run: npm run build

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------
  # 2. Install + test the frontend
  # ---------------------------------------------------------------------
  frontend-tests:
    name: Frontend — install, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_ASSET_URL: http://localhost:5000
          VITE_REVIEW_SERVICE_URL: http://localhost:5001/api

  # ---------------------------------------------------------------------
  # 3. Review service — install, type-check, build
  # ---------------------------------------------------------------------
  review-service-build:
    name: Review service — install, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: review-service/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # `prisma generate` (postinstall) needs a DATABASE_URL to exist,
          # even though it never connects to it — this is a placeholder,
          # not a real credential.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

      - name: Build (type-check + compile)
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

  # ---------------------------------------------------------------------
  # 4. Docker build verification — proves both images still build cleanly
  # ---------------------------------------------------------------------
  docker-build-check:
    name: Docker build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_URL=http://localhost:5000/api
            VITE_ASSET_URL=http://localhost:5000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build review-service image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./review-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 5. Deploy to production — ONLY on a push (i.e. a merge) to main, and
  #    only after every check above has passed. Uses the `production`
  #    GitHub Environment, so its secrets are separate from repo-level
  #    secrets and can be given required reviewers / wait timers in repo
  #    settings for an extra manual gate if you want one.
  # ---------------------------------------------------------------------
  deploy-production:
    name: Deploy to production
    needs:
      [backend-tests, frontend-tests, review-service-build, docker-build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy backend
        working-directory: backend
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}

      - name: Run production database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Deploy review service
        working-directory: review-service
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_REVIEW_PROJECT_ID }}

      - name: Deploy frontend
        working-directory: frontend
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
