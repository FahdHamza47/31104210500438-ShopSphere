<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="340" y1="64" x2="340" y2="98" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 156 L340 183 L185 183 L185 208" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 156 L340 183 L495 183 L495 208" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M185 266 L185 300 L340 300 L340 328" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M495 266 L495 300 L340 300 L340 328" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>

<text x="215" y="178" font-size="12" fill="#5F5E5A">products / cart / orders</text>
<text x="400" y="178" font-size="12" fill="#5F5E5A">reviews (REST)</text>
<text x="60" y="296" font-size="12" fill="#5F5E5A">Prisma</text>
<text x="500" y="296" font-size="12" fill="#5F5E5A">Prisma</text>

