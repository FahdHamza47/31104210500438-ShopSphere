<text x="340" y="124" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">Frontend</text>
<text x="340" y="142" font-size="12" text-anchor="middle" fill="#185FA5">Vercel · React SPA</text>
</g>

