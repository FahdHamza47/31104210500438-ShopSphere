name: CI/CD Pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — install, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopsphere_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopsphere_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shopsphere_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopsphere_ci
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shopsphere_ci
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations to the CI database
        run: npx prisma migrate deploy

      - name: Build (type-check + compile)
        run: npm run build

      - name: Run tests
        run: npm test

  frontend-tests:
    name: Frontend — install, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_ASSET_URL: http://localhost:5000
          VITE_REVIEW_SERVICE_URL: http://localhost:5001/api

  review-service-build:
    name: Review service — install, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: review-service/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

      - name: Build (type-check + compile)
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

  docker-build-check:
    name: Docker build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_URL=http://localhost:5000/api
            VITE_ASSET_URL=http://localhost:5000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build review-service image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./review-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to production
    needs:
      [backend-tests, frontend-tests, review-service-build, docker-build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy backend
        working-directory: backend
        run: |
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run production database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Run production database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Deploy review service
        working-directory: review-service
        run: |
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_REVIEW_PROJECT_ID }}

      - name: Deploy frontend
        working-directory: frontend
        run: |
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
