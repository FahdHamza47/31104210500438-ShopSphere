<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<title>ShopSphere production architecture</title>
<desc>Browser connects to a Vercel-hosted React frontend, which calls a Vercel-hosted Express backend for products/cart/orders and an independent Vercel-hosted review microservice for reviews. Both backends read/write a shared Supabase PostgreSQL database via Prisma.</desc>
