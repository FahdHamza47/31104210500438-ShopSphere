# Copy to secret.yaml (gitignored) and fill in real values, or create
# imperatively instead:
#   kubectl create secret generic shopsphere-backend-secrets \
#     --namespace=gcp-simulation \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=CORS_ORIGIN=http://localhost:5173
apiVersion: v1
kind: Secret
metadata:
  name: shopsphere-backend-secrets
  namespace: gcp-simulation
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:your-password@db.your-project-ref.supabase.co:6543/postgres?pgbouncer=true"
  DIRECT_URL: "postgresql://postgres:your-password@db.your-project-ref.supabase.co:5432/postgres"
  JWT_SECRET: "replace-with-a-long-random-value"
  CORS_ORIGIN: "http://localhost:5173"
